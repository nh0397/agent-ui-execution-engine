name: agent-ui-execution-engine

services:
  dashboard:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:5173:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [demo-network, access-network]
    depends_on:
      worker:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: engine/Dockerfile
    environment:
      DEMO_ENTRY: http://cedar.test:8000
      OLLAMA_URL: http://host.docker.internal:11434
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      LLM_DAILY_REQUEST_LIMIT: ${LLM_DAILY_REQUEST_LIMIT:-100}
      DASHBOARD_STORAGE: /project/work/dashboard
    volumes:
      - execution-data:/project/work/dashboard
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=8)"]
      interval: 10s
      timeout: 10s
      retries: 15
    depends_on:
      app:
        condition: service_healthy
    networks: [demo-network, access-network]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: service_desk
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Run python -m demo.setup first}
    volumes:
      - demo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d service_desk"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [demo-network]

  app:
    build: .
    environment:
      DEMO_DATABASE_URL: postgresql://demo:${DEMO_DB_PASSWORD:?Run python -m demo.setup first}@db:5432/service_desk
      DEMO_SCENARIO: ${DEMO_SCENARIO:-normal}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      demo-network:
        aliases: [cedar.test]
      access-network: {}

volumes:
  demo-data:
  execution-data:

networks:
  access-network:
  demo-network:
    internal: true
